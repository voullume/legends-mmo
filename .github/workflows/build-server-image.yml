name: build-server-image

# Build the dedicated zone-server Docker image OFF the droplet (GitHub's runners have plenty of RAM),
# then push it to GHCR. The droplet's deploy/setup.sh pulls this prebuilt image instead of building
# on-box — so a redeploy is a fast `docker pull` that can never OOM/swap-thrash the 1 GB droplet.
# The image contains no secrets (the SUPABASE_SERVICE_KEY is injected at `docker run`, not baked in).

on:
  push:
    branches: [main]
    tags: ['v*']               # a release tag (deploy/release.sh) → an exact vX.Y.Z image copy
  workflow_dispatch: {}        # also runnable on demand from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # push to ghcr.io under this repo's owner
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Derive image tags: :latest + :<sha> on main; :vX.Y.Z + :X.Y.Z (+ :latest) on a release tag.
      # The vX.Y.Z image is the immutable "exact saved copy" of that deployed version.
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/voullume/legends-mmo
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ github.sha }}
            type=ref,event=tag
            type=semver,pattern={{version}}
      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
